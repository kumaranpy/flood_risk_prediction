name: AquaSense CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Data Preparation & Splitting
      run: |
        python src/data/preprocess.py

    - name: Train & Calibrate ML Pipeline
      run: |
        python src/models/train.py

    - name: Evaluate on Untouched Test Split
      run: |
        python src/models/evaluate.py

    - name: Run Test Suite (Target Leakage, Pipeline Parity, Data Quality)
      run: |
        pytest tests/ -v --tb=short

    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check src/ api/ app/ tests/ --ignore E501 || true
