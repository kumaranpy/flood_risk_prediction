name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run Data Preparation & Splitting
      run: |
        python src/preprocess.py

    - name: Train & Calibrate ML Pipeline
      run: |
        python src/train.py

    - name: Evaluate on Untouched Test Split
      run: |
        python src/evaluate.py

    - name: Run Test Suite (Target Leakage, Pipeline Parity, Data Quality)
      run: |
        pytest tests/ -v
