<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="dropGradient" x1="20" y1="10" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="pulseGradient" x1="10" y1="65" x2="110" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#FFFFFF" />
      <stop offset="80%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer ambient ring -->
  <circle cx="60" cy="60" r="54" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="4 6" />

  <!-- Water Drop Contour -->
  <path d="M60 14 C60 14 26 56 26 78 C26 97 41.2 110 60 110 C78.8 110 94 97 94 78 C94 56 60 14 60 14 Z" 
        fill="url(#dropGradient)" 
        fill-opacity="0.92"
        stroke="#38BDF8" 
        stroke-width="2.5" 
        filter="url(#glow)" />

  <!-- Inner Highlight Reflection -->
  <path d="M42 48 C42 48 34 62 34 74 C34 82 39 88 42 88" 
        stroke="#FFFFFF" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-opacity="0.45" />

  <!-- Pulse / Sensor Waveform Line -->
  <path d="M22 72 L42 72 L49 60 L55 84 L65 52 L73 78 L79 72 L98 72" 
        stroke="url(#pulseGradient)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Central Pulse Focal Node -->
  <circle cx="65" cy="52" r="3" fill="#FFFFFF" filter="url(#glow)" />
</svg>
